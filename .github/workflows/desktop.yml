name: desktop

# Packages the desktop app (docs/desktop.md). Linux: AppImage and deb, then the deb is installed
# and the app launched headless as a smoke test. macOS: dmg and zip, opt-in like ci-macos (the
# ci:macos label, a manual run, or a tag when the DESKTOP_MACOS variable is "true"). Signing
# secrets reach only the macOS job, and only on a push or a manual run, never a pull request.
on:
  pull_request:
    branches: [main, next]
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "web/**"
      - "clients/protocol.schema.json"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main, next]
    tags: ["v*.*.*"]
    paths:
      - "web/**"
      - "clients/protocol.schema.json"
      - "Cargo.toml"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:
    inputs:
      macos:
        description: "Also build the macOS dmg and zip"
        type: boolean
        default: false

permissions:
  contents: read

# As in ci-macos: another label than ci:macos gets a group of its own and cancels nothing.
concurrency:
  group: desktop-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name != 'ci:macos' && github.run_id || 'run' }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

defaults:
  run:
    shell: bash
    working-directory: web/apps/desktop

jobs:
  linux:
    # A label other than ci:macos changes nothing on Linux.
    if: github.event.action != 'labeled'
    name: linux packages and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: install the locked dependencies
        run: |
          (cd ../.. && npm ci --no-audit --no-fund)
          npm ci --no-audit --no-fund
      - name: typecheck and packaging tests
        run: |
          npm run typecheck
          node --test test/packaging/*.test.ts
      - name: build the AppImage and deb (unsigned)
        run: npm run package -- --target linux
      - name: list the packages
        working-directory: target/desktop
        run: ls -l && sha256sum ./*.AppImage ./*.deb
      # Electron's sandbox needs unprivileged user namespaces, which Ubuntu's AppArmor restricts.
      - name: allow unprivileged user namespaces for the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: install the deb
        working-directory: target/desktop
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q xvfb ./aether-desktop_*_amd64-unsigned.deb ||
            sudo apt-get install -y -q xvfb ./Aether-*-linux-amd64-unsigned.deb
          dpkg -s aether-desktop | sed -n '1,/^Description/p'
      - name: smoke test the installed deb
        run: xvfb-run -a node build/smoke.ts --exec /opt/Aether/aether-desktop --resources /opt/Aether/resources --signing unsigned
      # Extracted, as a runner has no FUSE to mount it with.
      - name: smoke test the AppImage
        run: |
          image=$(realpath ../../../target/desktop/Aether-*-linux-x86_64-unsigned.AppImage)
          root=$(mktemp -d)
          (cd "$root" && "$image" --appimage-extract >/dev/null)
          xvfb-run -a node build/smoke.ts --exec "$root/squashfs-root/aether-desktop" \
            --resources "$root/squashfs-root/resources" --signing unsigned
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-linux
          path: |
            target/desktop/*.AppImage
            target/desktop/*.deb
            target/desktop/latest-linux.yml
          if-no-files-found: error

  macos:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.macos)
      || (github.ref_type == 'tag' && vars.DESKTOP_MACOS == 'true')
      || (github.event.action == 'labeled' && github.event.label.name == 'ci:macos')
      || (github.event_name == 'pull_request' && github.event.action != 'labeled' && contains(github.event.pull_request.labels.*.name, 'ci:macos'))
    name: macos packages
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: install the locked dependencies
        run: |
          (cd ../.. && npm ci --no-audit --no-fund)
          npm ci --no-audit --no-fund
      # Unset secrets are empty, and build/signing.ts treats empty as absent: the build is then
      # unsigned and named so. A pull request never gets them, whoever opened it.
      - name: build the dmg and zip
        env:
          CSC_LINK: ${{ github.event_name != 'pull_request' && secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name != 'pull_request' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run package -- --target mac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-macos
          path: |
            target/desktop/*.dmg
            target/desktop/*.zip
            target/desktop/latest-mac.yml
          if-no-files-found: error

  # On a release tag, the packages and their update files join the draft release that
  # release.yml opens for the same tag; the owner publishes it, and only then can apps update.
  publish:
    needs: [linux, macos]
    if: >-
      always() && github.ref_type == 'tag' && needs.linux.result == 'success'
      && (needs.macos.result == 'success' || needs.macos.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: dist
          merge-multiple: true
      - name: attach the packages to the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # release.yml builds for a while before it opens the draft: wait up to 45 minutes.
          for attempt in $(seq 1 90); do
            if gh release view "$TAG" >/dev/null 2>&1; then break; fi
            if [ "$attempt" -eq 90 ]; then echo "::error::no release $TAG to attach to"; exit 1; fi
            sleep 30
          done
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" != true ]; then
            echo "::error::release $TAG is already published; attach the packages by hand after checking them"
            exit 1
          fi
          (cd dist && sha256sum ./* > SHA256SUMS.desktop && cat SHA256SUMS.desktop)
          gh release upload "$TAG" dist/* --clobber
