name: web-perf

# The frontend perf budgets (web/perf/budgets.json) on every pull request. Runner hardware differs
# from the host the wall-time and heap budgets were set on, so this enforces only the measures that
# are the same on any host: render and commit counts, DOM sizes, layouts and bundle bytes.
on:
  pull_request:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-perf-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: web

jobs:
  budgets:
    name: perf budgets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: install the locked dependencies
        run: npm ci --no-audit --no-fund
      # The bundle budgets measure this pull request's sources, not a web/dist it forgot to rebuild.
      - name: build web/dist
        run: npm run build
      - name: check the host-independent budgets
        run: npm run perf:ci
