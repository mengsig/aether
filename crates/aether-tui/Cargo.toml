[package]
name = "aether-tui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Terminal user interface for the Aether agent harness"

[lints]
workspace = true

[dependencies]
aether-core = { workspace = true }
aether-protocol = { workspace = true }
aether-client = { workspace = true }
aether-model = { workspace = true }
aether-net = { workspace = true }
anyhow = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
textwrap = { workspace = true }
chrono = { workspace = true }
dirs = { workspace = true }
nix = { workspace = true, features = ["fs"] }
reqwest = { workspace = true }
sha1 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
tempfile = { workspace = true }
ulid = { workspace = true }
pulldown-cmark = { version = "0.13.0", default-features = false }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
html2text = { version = "0.17.4", default-features = false }
html5ever = { version = "0.40.1", default-features = false }

[dev-dependencies]
aether-daemon = { workspace = true }
rusqlite = { workspace = true }
aether-store = { workspace = true }
