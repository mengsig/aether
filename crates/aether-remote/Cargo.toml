[package]
name = "aether-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Remote listener, WebSocket carrier, device pairing and Web Push for the Aether agent harness"
build = "build.rs"

[lints]
workspace = true

[features]
# The user-agent side of Web Push and in-memory collaborators, for tests.
test-support = []

[dependencies]
aether-core = { workspace = true }
aether-protocol = { workspace = true }
aether-net = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
parking_lot = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
ulid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
tracing-subscriber = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
