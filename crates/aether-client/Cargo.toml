[package]
name = "aether-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Rust client for the Aether daemon protocol"

[lints]
workspace = true

[dependencies]
aether-core = { workspace = true }
aether-net = { workspace = true }
aether-protocol = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true }
hyper-util = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
rustix = { version = "1.1.4", features = ["fs", "process"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
aether-tools = { workspace = true }
reqwest = { workspace = true }
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tracing-subscriber = { workspace = true }
